#n_pre: 10                                     # the number of iterations of pre-smoother
#n_post: 10                                    # the number of iterations of post-smoother
#max_levels: 8                                 # the number of different levels of grids
#ratio_MG: 10                                  # the iteration steps for jacobi/deeponet