# ============================
# 1. PDE problem configs
# ============================
problem:
  type: diffusion2d
  method: fdm
  n_dim: 2
  output_dim: 1
  iteration: 700
  tolerance: !!float 1e-10

# =================================================================================
# 2.1 Data generation configs
# =================================================================================
data:
  func_num: 5000
  train_ratio: 0.90
  threshold: 1.0
  redundancy: 1.0

  mesh:
    grid_nx: 31
    grid_ny: 31
    grid_type: uniform

  k_x:
    generator: grf
    grf_setting:
      sigma: [0.3,]
      l0: [0.1,]
      mean: 1.0
      minimal: 0.3
    fixed_setting:
      value: 1.0
    gaussian_setting:
      standard: true

  f_x:
    generator: grf
    grf_setting:
      sigma: [1.0,]
      l0: [0.1,]
    gaussian_setting:
      standard: true
    fixed_setting:
      value: 1.0
    fourier_setting:
      freq_num: 3
      freq_upper: 10
      amplitude: 0.5

# ============================
# 2.2 Testing data generation
# ============================
testing:
  func_num: 30
  threshold: 1.0
  redundancy: 1.0

  mesh:
    grid_nx: 121
    grid_ny: 121
    grid_type: uniform

  k_x:
    generator: grf
    grf_setting:
      sigma: [0.3,]
      l0: [0.1,]
      mean: 1.0
      minimal: 0.3
    fixed_setting:
      value: 1.0
    gaussian_setting:
      standard: true

  f_x:
    generator: [grf, fixed, gaussian,]
    fixed_setting:
      value: 1.0
    gaussian_setting:
      standard: true
    grf_setting:
      sigma: [1.0,]
      l0: [0.1,]

# ============================
# 3. Neural operator training
# ============================
training:
  mode: static
  operator_type: fns
  batch_size: 256
  num_epoch: 101
  lr: 0.0001
  weight_decay: !!float 1e-8

  loss:
    type: Error
    norm: l2
    relative: true
    relative_eps: !!float 1e-12
    grad_alpha: 0.1
    use_autograd: false

  grad_clip:
    enabled: true
    max_norm: 25.0

  don_setting:
    f_dim: 80
    hard_cons: false

  fns_setting:
    meta_lambda: fno
    act: gelu
    hidden: 32
    dims: [32, 64, 64, 32]
    depths: [2, 2, 2, 2]
    modes: [8, 8, 8, 8]
    fno_padding: 2

  dynamic:
    horizon_size: 10
    curriculum:
      enabled: true
      update_interval: 10

# ==========================================================
# 4. Hybrid solver
# ==========================================================
solver:
  type: Hybrid
  numerical:
    method: jacobi
    relaxation_factor: 0.6
    numerical_update: fixed
    AA:
      m: 10
      reg: 1e-16

  hybrid:
    update_ratio: 20
    neural_update: fixed
    AA:
      m: 10
      reg: 1e-10
